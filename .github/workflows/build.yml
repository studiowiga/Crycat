name: Build CRYCAT VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: CRYCAT-VST3-Windows
          path: build/Crycat_artefacts/Release/VST3/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure (binaire universel Intel + Apple Silicon)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Signature locale (ad hoc) et archive
        run: |
          cd build/Crycat_artefacts/Release/VST3
          xattr -cr CRYCAT.vst3
          codesign --force --deep --sign - CRYCAT.vst3
          codesign --verify --deep --strict CRYCAT.vst3
          ditto -c -k --sequesterRsrc --keepParent CRYCAT.vst3 "$GITHUB_WORKSPACE/CRYCAT-VST3-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CRYCAT-VST3-macOS
          path: CRYCAT-VST3-macOS.zip
          if-no-files-found: error
